; ===========================================================================
; F4LoadText - Fallout 4 F4SE plugin
;
; Intercepts text fields while the game reads plugin files: records defined by
; the listed base plugins keep their base text even when other plugins
; override them. Also writes translations (yaml) into a plugin's own records.
;
; All keys use the English names shown here. The legacy Chinese key names
; (功能 / 名单 / 汉化 / 调试 ...) are still parsed, so old configs keep working.
;
; NOTE: UTF-8, no BOM, LF line endings. Save as "UTF-8" (not "UTF-8 with BOM").
; ===========================================================================


[General]
; ---------------------------------------------------------------------------
; Master switch. false = the DLL still loads, but changes nothing.
; 总开关。false -> DLL 照常加载，但一个字都不改。
Enable = true


[Whitelist]
; ---------------------------------------------------------------------------
; Protected records. Text of these records is discarded when a plugin that is
; NOT in this list overrides it - the base text wins.
;
; Entry forms (plugin names are case-insensitive, '*' is a wildcard):
;   SomeMod.esp          every record of that plugin
;   SomeMod.esp|0012AB   one record, by plugin-local raw ID (hex)
;   *|000800             that raw ID in any plugin
; An empty list changes nothing. Write "Entries = *" to protect everything.
; Separators: half-width comma or full-width `，` / `、` (both accepted).
;
; 受保护的记录。名单内记录的文本被**名单外**插件覆盖时，丢弃那份覆盖、保住基底文本。
; 条目形态：插件名 / 插件名|插件内ID（十六进制）/ *|ID（任意插件）。空 = 什么都不改。
; 分隔符：半角逗号，或全角 `，` / `、`（中文输入法直接敲也认）。
;
; Default: the 7 official ESMs plus the CC content used by this setup.
; 默认：官方 7 个 esm + 本机在用的 CC 内容。
Entries = Fallout4.esm, DLCRobot.esm, DLCCoast.esm, DLCNukaWorld.esm, DLCworkshop01.esm, DLCworkshop02.esm, DLCworkshop03.esm, ccBGSFO4044-HellfirePowerArmor.esl, ccBGSFO4046-TesCan.esl, ccBGSFO4096-AS_Enclave.esl, ccBGSFO4110-WS_Enclave.esl, ccBGSFO4115-X02.esl, ccBGSFO4116-HeavyFlamer.esl, ccFSVFO4007-Halloween.esl, ccOTMFO4001-Remnants.esl, ccSBJFO4003-Grenade.esl


[Translation]
; ---------------------------------------------------------------------------
; Reads translations\*.yaml (the "dest" field of each entry) directly.
; Edit a yaml, restart the game, done - no dictionary build step.
;
; Division of labour with [Whitelist] above:
;   [Whitelist]   -> "listed record overridden by an unlisted plugin": discard
;                    the override, keep the base text. Produces no translation.
;   [Translation] -> writes the yaml text into the plugin's OWN records
;                    (including plugins that are not in [Whitelist]).
; Both run; a given field can only be caught by one of them.
; Priority: yaml translation > base text.
;
; Only fields that pass through the engine's load hooks are covered
; (FULL / DESC / ITXT / UNAM / WNAM ...). Crosshair prompts, mod-assembly names
; and other fields that are not loaded this way are out of scope.
;
; yaml entries carrying an official master form ID (e.g. "WRLD 0000003C")
; are skipped here - those belong to [Whitelist].
;
; 直接读本目录下的 translations\*.yaml（每条里的 dest）。
; 改完 yaml 重开游戏即生效，不需要再跑任何字典编译脚本。
; 与 [Whitelist] 分工：
;   [Whitelist]   -> 名单内记录被名单外插件覆盖时，丢弃覆盖、保住基底（不产生译文）
;   [Translation] -> 把 yaml 译文写进插件**自己的**记录（含不在名单里的 mod）
; 优先级：yaml 译文 > 基底。
; 只对经过加载钩子的字段生效（FULL / DESC / ITXT / UNAM / WNAM...）；
; 准星提示、拼装名、字幕这类不走加载的字段不在此列。
; 带官方 master form ID 的 yaml 条目会被跳过 - 那属于 [Whitelist] 的地盘。
Translation = true

; Directory holding the yaml files, relative to the plugin directory.
; 译文目录，相对插件目录（MO2 下就是 mod 文件夹里那份）。
TranslationDir = F4LoadText\translations

; Binary cache (dictionary.cache) stored next to the yaml files.
; Parsing ~5 MB of yaml takes ~950 ms; the cache brings that down to ~10 ms.
; Any change to the yaml files (name / size / mtime) rebuilds it silently.
; The cache is only a speed-up: missing, corrupt or outdated never loses text.
; 二进制缓存。解析 5 MB yaml 约 950 ms，走缓存约 10 ms。
; yaml 有增删改（文件名/大小/修改时间）会自动失效重建。
; 缓存只是加速手段：缺失/损坏/过时都不影响译文正确性。
TranslationCache = true


[Debug]
; ---------------------------------------------------------------------------
; Logging is split into three independent groups. Enable only the one you need:
;   (1) Info     : startup / plugin list / hook report / end-of-load summary,
;                  plus the DESC probe. About 10 lines.
;   (2) Audit    : one line per field that actually changed. Volume controlled
;                  by AuditLimit + AuditSignatures.
;   (3) Advanced : diagnostics - named tracking and "identity could not be
;                  determined" warnings. For troubleshooting only.
;
; One-line reminder: Info = startup and totals; Audit = what changed;
;                    Advanced = why nothing changed.
;
; Info is the MASTER switch: with Info = false nothing informational is
; written at all - audit lines and FocusRecords tracking included (they are
; REX::INFO lines too). That is also the cheapest setting: the audit path is
; skipped before it even resolves a formID. If you set AuditLimit or
; FocusRecords and leave Info = false, the plugin writes a WARN telling you
; so - that combination is a silent no-op otherwise.
;
; WARNING - log volume: per-line logging has blown this log up before (the
; subtitle probe once produced 6799 lines in one load). Turn Info and Advanced
; back off when you are done troubleshooting.
;
; 日志分三类，各自独立，只开你需要的那一个：
;   (1) Info     ：启动 / 名单 / hook 报告 / 收尾汇总 + DESC 探针，约 10 行
;   (2) Audit    ：逐条"真改动"的回写行，量由 AuditLimit + AuditSignatures 控制
;   (3) Advanced ：诊断（指名追踪 + 归属判定失败告警），排查时才开
; 一句话记法：Info = 启动与总账；Audit = 改了什么；Advanced = 为什么没改。
; ⚠ 信息 = **总闸**（2026-11-01 起）：Info = false 时任何信息类日志都不写，
;   审计行与「关注记录」追踪也在里面（它们同样是 REX::INFO）。这也是最省的设置：
;   审计路径连 formID 都不会去取。反过来，配了审计上限 / 关注记录 却把 Info 关着，
;   插件会额外打一条 WARN 提醒你 —— 否则那对组合就是静默失效。
; 警告：逐条日志在这个项目里翻过车（曾涨到 889 MB），排查完记得关回去。

; Asynchronous logging. Writes only enqueue; a background thread flushes to
; disk, so even with Info/Audit on the game thread never blocks on file I/O.
; Only affects this plugin's logger. When the queue is full the oldest entries
; are dropped - logging never blocks the caller. Set false to debug lost lines.
;
; 异步日志：写日志只入队，落盘由后台线程做 -> 即便开着 Info/Audit 也不会卡帧。
; 只影响本插件。队列满时丢最旧的，永不阻塞调用方。关掉 = 回到同步（排查丢日志用）。
AsyncLog = true
; (1) Info: startup / plugin list / hook report / summary / DESC probe.
; (1) 信息：启动 / 名单 / hook 报告 / 收尾汇总 / DESC 探针。
Info = false
; (2) Audit: max number of "回写[...]" lines, 0 = off.
;     Only fields whose written value differs from the loaded one are logged,
;     and each line carries the full text (terminal bodies can exceed 1 KB).
;     For reference: 300 lines is roughly 145 KB.
; (2) 审计：逐条回写的行数上限，0 = 关。只在真改动时打印，
;     每行带全文（终端正文动辄上千字）。参考：300 条约 145 KB。
;     ⚠ 需要 Info = true（审计跟着「信息」走；Info 关了这里设多少都不打）。
;     ⚠ 这个上限很容易在“真正想看的那行”之前用完：UFO4P 一次覆盖上万条 INFO，
;       200 条几秒就打满（2026-10-31 实测 188+12=200 正好卡死）—— 想精准就配下面的
;       「审计文本」，没命中的行不占额度。
AuditLimit = 0
; (2) Audit: only log these RECORD signatures, comma separated, case-insensitive.
;     Empty or * = all.
;     WARNING: this is the 4-byte RECORD signature (OMOD, PERK, ARMO ...), NOT
;     the field 4CC. Writing "DESC" here matches nothing (no record type is
;     named DESC) and you get zero lines. TERM (terminal bodies) is by far the
;     longest type - filter it out first if the log gets big.
; (2) 审计：只打印这些**记录签名**，逗号分隔、不分大小写；空或 * = 全部。
;     警告：这是记录的 4 字节签名（OMOD / PERK / ARMO...），不是字段 4CC。
;     写 "DESC" 谁都匹配不上 -> 一行都不打（DESC 是**字段**，不是记录类型）。
;     TERM（终端机）正文最长，嫌日志大就先把它排除掉。
AuditSignatures =
; (2) Audit: only log writes whose TEXT contains one of these substrings,
;     comma separated. Empty = no text filter. Matched against BOTH sides:
;     what the engine loaded and what we wrote back.
;     This is the precise tool: a non-matching write costs nothing (no line,
;     no quota), so AuditLimit stops mattering. CJK works as-is (UTF-8).
; (2) 审计：只打印**文本包含**下列子串的回写，逗号分隔；空 = 不过滤。
;     两边都匹配（引擎读进来的 / 我们写回去的）。
;     这是精准工具：不命中的写入不占一行、也不占额度，于是上限不再影响你。
;     例：AuditText = 圣三角,庇护山丘
AuditText =
; (3) Advanced: diagnostics master switch (default false). Does not affect
;     functionality - "discard override", DESC write-back and translations all
;     keep working while this is off.
;     Enabling it adds: "关注(...)" named-tracking lines, "身份判定失败"
;     warnings, and makes the DESC probe cover unlisted records too.
; (3) 高级：诊断总闸（默认 false）。**不影响功能** - 关着时覆盖丢弃、DESC 回写、
;     译文照常工作。开启后多出：关注(...) 追踪行、身份判定失败 告警、
;     DESC 探针也打名单外的记录。
Advanced = false

; (3) Advanced: named tracking. Records listed here are logged in full at every
;     step (identity resolved or not, changed or not), do not consume AuditLimit,
;     and ignore both the "actually changed" threshold and the signature filter.
;     Same entry syntax as [Whitelist], e.g. Plugin.esp|029C10.
;     Use it when one record stubbornly stays untranslated.
; (3) 高级：指名追踪。命中的记录一路打全（判定成功/失败、有没有改动都打），
;     不占 AuditLimit，不受"真改动"门槛与签名白名单限制。
;     条目形态与 [Whitelist] 相同（插件名|插件内ID，十六进制）。
;     ID 两种写法都认：插件内原始 ID（低位，如 0F9A）或运行时 formID（日志里
;     record= 那一串，如 FE004F9A）；高位不掩码 —— 写 0A000F9A 这种“文件里的
;     原始 formID”两边都不是，会静默不命中。
;     排"某条记录怎么没变中文"的时候用它。
;     ⚠ 同样需要 Info = true（它是 REX::INFO 行）。
FocusRecords =
